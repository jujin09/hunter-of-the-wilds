<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hunter of the Wilds</title>
<link rel="icon" id="favLink" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#140609">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunter of the Wilds">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Song+Myung&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe5e0;--bg2:#d3dbd5;--panel:#f5f8f4;--panel2:#eaf0eb;--ink:#16221d;--muted:#56665e;--line:#c4cfc8;
  --bronze:#a3622a;--bronze-ink:#fff;--lichen:#4f7a55;--chip:#e3eae4;--shadow:0 1px 0 rgba(22,34,29,.06),0 6px 18px -12px rgba(22,34,29,.35);
  --accent:var(--bronze);--accent-ink:var(--bronze-ink);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--bg2:#131d18;--panel:#17221d;--panel2:#1d2a24;--ink:#e6eee8;--muted:#93a49b;--line:#2a3a32;--bronze:#e0a160;--bronze-ink:#1d1206;--lichen:#8fbf8f;--chip:#22302a;--shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -16px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1713;--bg2:#131d18;--panel:#17221d;--panel2:#1d2a24;--ink:#e6eee8;--muted:#93a49b;--line:#2a3a32;--bronze:#e0a160;--bronze-ink:#1d1206;--lichen:#8fbf8f;--chip:#22302a;--shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -16px rgba(0,0,0,.8);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.big{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400}

/* ---------- 길드 ---------- */
#hub{position:fixed;inset:0;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(120% 60% at 50% -10%,var(--bg2),var(--bg) 60%)}
#hub[hidden]{display:none}
.hubIn{max-width:680px;margin:0 auto}
#hub h1{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:44px;line-height:.95;margin:4px 0 8px;letter-spacing:-1px}
#hub h1::after{content:"";display:block;width:56px;height:4px;border-radius:2px;background:var(--bronze);margin-top:10px}
#hub .lead{color:var(--muted);margin:0 0 14px;max-width:46ch}
.hrbox{display:grid;grid-template-columns:auto auto 1fr 1fr;gap:8px;margin:0 0 14px}
#monBtns{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(134px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:200px;z-index:5;pointer-events:auto}
@media (max-height:500px) and (orientation:landscape){#monBtns{top:calc(96px + env(safe-area-inset-top,0px))}}
#monBtns:empty{display:none}
#monBtns button{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid #6e5526;background:#1a140e;overflow:hidden;pointer-events:auto;position:relative}
#monBtns button img{width:100%;height:100%}
#monBtns button.tg{border-color:#ff4d4d}
#monBtns button.on{border-color:#ffd76a;box-shadow:0 0 0 2px #ffd76a,0 0 10px #ffd76a}
#monBtns button.pv{opacity:.55}
.profBtn{border:1px solid var(--gold);border-radius:14px;background:linear-gradient(180deg,#6b4a2c,#4a3220);color:#f3e6c8;font-size:22px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.profBtn small{font-size:11px;font-family:"Nanum Myeongjo",serif;color:#f3e6c8}
#syncBadge[hidden],#installBtn[hidden]{display:none!important}
.prof td{padding:5px 6px;border-bottom:1px solid var(--line);font-size:13.5px}.prof td:first-child{color:var(--muted);white-space:nowrap}.prof{width:100%;border-collapse:collapse;text-align:left}
.hrbox>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:var(--shadow)}
.hrbox b{display:block;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:24px;line-height:1.1}
.hrbox small{color:var(--muted);font-size:12.5px}
.hrbox .rank{background:var(--ink);color:var(--bg);border-color:var(--ink);text-align:center;min-width:86px}
.hrbox .rank small{color:inherit;opacity:.75}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 2px;padding:4px;background:var(--panel2);border:1px solid var(--line);border-radius:14px}
.tabs button{padding:10px;border-radius:10px;border:0;background:transparent;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
#hub h2{font-size:17px;margin:24px 0 10px;display:flex;align-items:center;gap:10px}
#hub h2::after{content:"";flex:1;height:1px;background:var(--line)}
#hub h2 small{font-size:12.5px;color:var(--muted);font-weight:400;order:3}
.stars{color:var(--bronze);letter-spacing:1px;font-size:15px}

/* 의뢰 카드 */
.quest{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 10px;margin-bottom:8px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.quest::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ec,#8a8f86)}
.quest .medal{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--ec,#8a8f86) 30%,var(--panel2)),var(--panel2) 70%);border:2px solid color-mix(in srgb,var(--ec,#8a8f86) 70%,transparent)}
.quest img{width:64px;height:64px}
.quest .qi{min-width:0}
.hj{font-size:.82em;color:var(--muted);font-weight:400;letter-spacing:.04em}
.quest .qt{display:block;color:var(--muted);font-size:12.5px}
.quest .qn{display:block;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:21px;line-height:1.15;margin:1px 0 4px}
.quest .chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.quest .chip{font-size:12px;background:var(--chip);border-radius:6px;padding:0 7px;color:var(--muted)}
.quest .desc{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.quest .go{flex:none;background:var(--bronze);color:var(--bronze-ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
.quest[disabled]{opacity:.5;cursor:default;box-shadow:none}
.quest.qmh{display:flex!important;align-items:center;gap:12px;grid-template-columns:none!important}
.quest.qmh .qi{min-width:0;flex:1 1 auto}
.quest.qmh .go{flex:none;width:auto!important;align-self:center;padding:10px 16px}
.starTabs{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:none;position:sticky;top:0;z-index:2;background:linear-gradient(180deg,var(--wood) 70%,transparent)}
.starTabs::-webkit-scrollbar{display:none}
.starTabs button{flex:none;position:relative;font-family:"Song Myung","Nanum Myeongjo",serif;font-size:16px;padding:8px 14px;border-radius:8px;border:1px solid #c9a045;background:linear-gradient(180deg,#6b4a2c,#4a3220);color:#f3e6c8}
.starTabs button.on{background:linear-gradient(180deg,#f0d78a,#c9a045 60%,#9c7426);color:#2a1a08;border-color:#5c3f10}
.starTabs button.lock{opacity:.55}
.starTabs button i{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#c62828;color:#fff;font-style:normal;font-size:12px;line-height:18px;text-align:center;font-family:sans-serif;box-shadow:0 0 0 2px #2a1c10}
.qlist>*{animation:qin .32s ease-out both}
@media (prefers-reduced-motion:reduce){.qlist>*{animation:none}}
.quest.qmh .qtitle{font-size:19px!important;line-height:1.25;display:block;margin-bottom:2px}
.quest.qmh .qmap{display:block;color:var(--muted);font-size:12.5px}
.quest.qmh .qcond{display:block;color:var(--bronze);font-size:12.5px;font-weight:700}
.quest.qmh .qobj{display:flex;align-items:center;gap:6px;margin:6px 0 4px;padding:4px 8px 4px 4px;background:rgba(120,80,30,.12);border:1px solid var(--pline);border-radius:6px;width:fit-content;font-size:13.5px}
.quest.qmh .qobj img{width:34px;height:34px;border-radius:50%;background:var(--parch2);border:1px solid var(--gold)}
.quest.qmh .chips{margin-top:2px}
.card{position:relative}
.ovX[hidden]{display:none!important}
.ovX{position:fixed;top:8px;left:8px;width:38px!important;height:38px;box-shadow:0 4px 12px rgba(0,0,0,.5);min-height:0!important;padding:0!important;margin:0!important;border-radius:50%!important;font-size:16px!important;line-height:1;background:linear-gradient(180deg,#6b4a2c,#4a3220)!important;color:#f3e6c8!important;border:1px solid #c9a045!important;z-index:2}
.quest.mis.done{opacity:.72}
.quest.mis.locked{opacity:.6}
.quest.mis .qcond{display:block;font-size:12.5px;margin-top:4px;color:var(--bronze);font-weight:700;line-height:1.5}
.quest.mut{border-color:#a855f7;box-shadow:0 0 0 2px rgba(168,85,247,.3),var(--shadow)}
.quest.mut .go{background:#7c3aed;color:#fff}
.tal{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.tal small{display:block;color:var(--muted);font-size:12.5px}
.tal button{border:0;border-radius:8px;padding:6px 12px;font-weight:700;background:var(--bronze);color:var(--bronze-ink)}
.tal button:disabled{background:var(--chip);color:var(--muted)}
.cards{display:grid;gap:8px;margin:10px 0}
.cards button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.cards button b{font-size:16px;display:block}
.quest.urgent{border-color:#c62828;box-shadow:0 0 0 2px rgba(198,40,40,.35),var(--shadow)}
.quest.urgent::before{background:#c62828!important;width:6px}
.quest.urgent .go{background:#c62828;color:#fff}
.quest.hidden{opacity:.55;box-shadow:none}
.quest.hidden .medal{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:30px;color:var(--muted);border-style:dashed}
.quest.hidden .go{background:var(--chip);color:var(--muted)}
.quest[disabled] .go{background:var(--chip);color:var(--muted)}
.quest[disabled] img{filter:grayscale(1) brightness(.6)}
.el{display:inline-block;font-size:12px;font-weight:700;color:#fff;padding:0 7px;border-radius:6px;text-shadow:0 1px 1px rgba(0,0,0,.35);vertical-align:1px}

/* 장비 */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 15px;box-shadow:var(--shadow)}
.seg button b{font-size:15px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg small{display:none}
.slot{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.slot small{display:block;color:var(--muted);font-size:12.5px}
.slot .lbl{flex:none;width:40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:700}
.slot .nm{flex:1;min-width:0;font-weight:500}
.slot .ch{flex:none;color:var(--bronze);font-weight:700;font-size:13px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sum div{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px}
.sum b{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:28px;display:block;line-height:1.1}
.sum small{opacity:.75}
.sklist{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:2px 14px;box-shadow:var(--shadow)}
.sk{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sk:last-child{border-bottom:0}
.sk small{display:block;color:var(--muted);font-size:12.5px}
.pips{flex:none;letter-spacing:2px;color:var(--bronze);font-size:13px;padding-top:2px}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.mchips button{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;display:flex;align-items:center;gap:6px;font-size:13.5px}
.mchips button.on{border-color:var(--bronze);box-shadow:inset 0 0 0 1px var(--bronze)}
.mchips img{width:32px;height:32px;border-radius:50%;background:var(--panel2)}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mat{background:var(--chip);border-radius:8px;padding:3px 10px;font-size:13px;border:0}
button.mat{border:1px dashed var(--line)!important;background:var(--panel2)}
.forge{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin-top:10px;box-shadow:var(--shadow)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow small{display:block;color:var(--muted);font-size:12.5px}
.frow small.need{color:var(--ink)}
.frow small .lack{color:#c2410c}
.frow button{flex:none;background:var(--bronze);color:var(--bronze-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.frow .fl{display:flex;gap:10px;align-items:center;min-width:0}
.frow .fimg{width:42px;height:42px;border-radius:50%;background:var(--panel2);flex:none}
.frow button:disabled{background:var(--chip);color:var(--muted);cursor:default}
.hint{color:var(--muted);font-size:13px;margin-top:12px;max-width:60ch}

/* ---------- 사냥 ---------- */
#hunt{position:fixed;inset:0;background:#2d4a2b;touch-action:none;-webkit-user-select:none;user-select:none}
#hunt[hidden]{display:none}
#cv{position:absolute;inset:0;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;color:#f2f5f0;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.hud .me,.hud .mo{background:rgba(12,18,15,.42);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud .me{width:46%;max-width:270px}
.hud .mo{width:46%;max-width:270px;text-align:right}
.bar{height:10px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;margin:4px 0;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.bar i{display:block;height:100%;transition:width .15s;border-radius:6px}
.bar.hp i{background:linear-gradient(#7ee2a0,#3fbf6c)}.bar.st i{background:linear-gradient(#ffe27a,#f2b51e)}.bar.mh i{background:linear-gradient(#ff7a6b,#d9363e)}
.bar.st,.bar.lg{height:6px}
.bar.lg i{background:#5ad1ff}
.bar.pal{height:4px;opacity:.9}.bar.pal i{background:#9fe8ff}
#trainHud{position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;gap:14px;background:rgba(12,18,15,.5);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:6px 14px;color:#fff;font-size:13px;pointer-events:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
#trainHud[hidden]{display:none}
#trainHud b{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:17px;margin-left:4px}
.frow.tree .tl{color:var(--muted);margin-right:-4px}
.shp{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:5px;vertical-align:1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dexgrid button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;box-shadow:var(--shadow)}
.dexgrid img{width:64px;height:64px}
.dexgrid button.unk img{filter:brightness(0) opacity(.35)}
.dexgrid button.unk{color:var(--muted)}
.dexgrid small{color:var(--muted);font-size:11px}
.dexd{text-align:left}
.dexd .hd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.dexd .hd img{width:96px;height:96px;border-radius:50%;background:var(--panel2);flex:none}
.dexd h4{margin:14px 0 6px;font-size:15px}
.dexd .mats{justify-content:flex-start;margin-bottom:4px}
.dexd h3::after{display:none}
.dexd p{color:var(--ink)!important;text-align:left;line-height:1.6;margin:0 0 8px}
.hz{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.hz th,.hz td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.hz th:first-child,.hz td:first-child{text-align:left}
.hz td.w{font-weight:700;color:var(--bronze)}
.hz tr.me td{background:color-mix(in srgb,var(--bronze) 10%,transparent)}
.elrow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;font-size:12px}
.elrow div{background:var(--panel2);border-radius:8px;padding:4px 2px}
.elrow b{display:block;color:var(--bronze);letter-spacing:1px}
.frow .fb{display:flex;flex-direction:column;gap:4px;flex:none}
.frow .fb button{padding:7px 12px}
.hud .row{font-size:12px;display:flex;flex-wrap:wrap;gap:2px 10px;opacity:.95}
.hud .mo .row{justify-content:flex-end}
#mName{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:18px;line-height:1.2}
#mName small{font-family:"IBM Plex Sans KR",sans-serif;font-size:12px}
#bFS{position:absolute;top:calc(84px + env(safe-area-inset-top,0px));right:calc(62px + env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:8px;background:linear-gradient(180deg,#3a2f22,#17120c);border:1px solid #b8913f;color:#f3e2bb;font-size:18px}
@media (max-height:500px) and (orientation:landscape){#bFS{top:calc(54px + env(safe-area-inset-top,0px));width:34px;height:34px;right:calc(52px + env(safe-area-inset-right,0px));font-size:15px}}
#bPause{position:absolute;top:calc(84px + env(safe-area-inset-top,0px));right:12px;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(12,18,15,.45);color:#fff;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);color:#fff;font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-size:34px;letter-spacing:-.5px;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.75);pointer-events:none;opacity:0;transition:opacity .25s;width:min(90vw,440px)}
#banner.on{opacity:1}
#banner small{display:block;font-family:"IBM Plex Sans KR",sans-serif;font-size:14.5px;font-weight:500;margin-top:6px;padding-top:6px;border-top:2px solid rgba(224,161,96,.85);text-shadow:0 1px 4px rgba(0,0,0,.8)}
#joyZone{position:absolute;left:0;bottom:0;width:50%;height:55%;touch-action:none}
#joyBase{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(12,18,15,.25);border:2px solid rgba(255,255,255,.3);display:none;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 2px 8px rgba(0,0,0,.4)}

  $("oExp").onclick=()=>{const code=exportSave();overlay(`<h3 class="big">백업 코드</h3><p>아래 코드를 메모장이나 카톡 나에게 보내기에 저장해 두세요. 다른 기기나 브라우저에서 "불러오기"로 붙여 넣으면 진행 상황이 그대로 옮겨져요.</p><textarea id="bk" readonly style="width:100%;height:120px;font:12px monospace;border-radius:8px;padding:8px;background:var(--panel2);color:var(--ink);border:1px solid var(--line)">${code}</textarea><button id="oC">복사하기</button><button class="sec" id="oX2">닫기</button>`);
    $("oC").onclick=async()=>{const t=$("bk");t.select();let ok=false;try{await navigator.clipboard.writeText(code);ok=true}catch(e){try{ok=document.execCommand("copy")}catch(e2){}}$("oC").textContent=ok?"복사됐어요!":"길게 눌러 직접 복사하세요"};$("oX2").onclick=ctrlSettings};
  $("oImp").onclick=()=>{overlay(`<h3 class="big">백업 코드 불러오기</h3><p>지금 진행 상황은 백업 코드의 내용으로 <b>덮어써져요</b>.</p><textarea id="bk" style="width:100%;height:120px;font:12px monospace;border-radius:8px;padding:8px;background:var(--panel2);color:var(--ink);border:1px solid var(--line)" placeholder="백업 코드를 붙여 넣으세요"></textarea><button id="oL">불러오기</button><button class="sec" id="oX2">취소</button>`);
    $("oL").onclick=()=>{try{importSave($("bk").value);overlay(`<h3 class="big">불러오기 완료</h3><p>진행 상황을 옮겨 왔어요.</p><button id="oA">확인</button>`);$("oA").onclick=()=>$("ov").hidden=true}catch(e){$("oL").textContent="코드가 올바르지 않아요"}};$("oX2").onclick=ctrlSettings};
  if($("tMat"))$("tMat").onclick=()=>{MONS.forEach(m=>m.mats.forEach(n=>S.mats[n]=(S.mats[n]||0)+30));for(const mk in SMALLD){for(const t of["A","B"])for(const i of[0,1]){const n=smallMat(mk,t,i);S.mats[n]=(S.mats[n]||0)+30}for(const i of[0,1]){const n=leadMat(mk,i);S.mats[n]=(S.mats[n]||0)+30}}S.mats[MUTX]=(S.mats[MUTX]||0)+30;save();sfx("craft");$("tMat").textContent="받았어요!"};
  if($("tFq"))$("tFq").onclick=()=>{S.cleared.dummy=(S.cleared.dummy||0)+10;save();renderHub();$("tFq").textContent="헌터 랭크 "+hunterRank()};
  $("oTour").onclick=()=>{$("ov").hidden=true;startSysTour()};if($("oPad"))$("oPad").onclick=()=>{$("ov").hidden=true;padEditor()};
  $("oTut").onclick=()=>{$("ov").hidden=true;startTutorial()};
  $("oReset").onclick=()=>{overlay(`<h3 class="big">정말 초기화할까요?</h3><p>모든 진행 상황이 지워지고 되돌릴 수 없어요.</p><button id="oY" style="background:linear-gradient(180deg,#c0392b,#7e1a10);color:#ffe9c4">초기화</button><button class="sec" id="oN">취소</button>`);
    $("oN").onclick=ctrlSettings;$("oY").onclick=()=>{resetData();overlay(`<h3 class="big">초기화 완료</h3><p>처음부터 다시 시작해요. 시작 선물도 다시 받았어요.</p><button id="oX2">확인</button>`);$("oX2").onclick=()=>$("ov").hidden=true}};
  $("ovC").querySelectorAll("[data-vol]").forEach(b=>b.onclick=()=>{const[k,v]=b.dataset.vol.split("|");S.ctrl.vol=Object.assign({bgm:.5,sfx:.8},S.ctrl.vol||{});S.ctrl.vol[k]=+v;save();auInit();auVol();sfx("click");ctrlSettings()});
  $("ovC").querySelectorAll("[data-cs]").forEach(b=>b.onclick=()=>{const[k,v]=b.dataset.cs.split("|");S.ctrl[k]=k==="mode"||k==="input"?v:k==="left"?v==="true":+v;save();ctrlSettings()});
  $("oX").onclick=()=>$("ov").hidden=true}
const LORE={lf_forest:["그라프론는 무리를 이끄는 두목이다. 부하들보다 몸집이 두 배는 크다.","볏과 큰 송곳니는 서열의 상징이며, 다치면 부하를 불러 모은다.","두목을 잡으면 무리의 소재를 한꺼번에 구할 수 있어 신참들의 단골 사냥감이다."],lf_jungle:["시크라토는 무리를 이끄는 두목이다. 부하들보다 몸집이 두 배는 크다.","볏과 큰 송곳니는 서열의 상징이며, 다치면 부하를 불러 모은다.","두목을 잡으면 무리의 소재를 한꺼번에 구할 수 있어 신참들의 단골 사냥감이다."],lf_desert:["사르바돈는 무리를 이끄는 두목이다. 부하들보다 몸집이 두 배는 크다.","볏과 큰 송곳니는 서열의 상징이며, 다치면 부하를 불러 모은다.","두목을 잡으면 무리의 소재를 한꺼번에 구할 수 있어 신참들의 단골 사냥감이다."],lf_volcano:["이그라돈는 무리를 이끄는 두목이다. 부하들보다 몸집이 두 배는 크다.","볏과 큰 송곳니는 서열의 상징이며, 다치면 부하를 불러 모은다.","두목을 잡으면 무리의 소재를 한꺼번에 구할 수 있어 신참들의 단골 사냥감이다."],lf_snow:["헬카로스는 무리를 이끄는 두목이다. 부하들보다 몸집이 두 배는 크다.","볏과 큰 송곳니는 서열의 상징이며, 다치면 부하를 불러 모은다.","두목을 잡으면 무리의 소재를 한꺼번에 구할 수 있어 신참들의 단골 사냥감이다."],lf_thunder:["페르치온는 무리를 이끄는 두목이다. 부하들보다 몸집이 두 배는 크다.","볏과 큰 송곳니는 서열의 상징이며, 다치면 부하를 불러 모은다.","두목을 잡으면 무리의 소재를 한꺼번에 구할 수 있어 신참들의 단골 사냥감이다."],lf_coast:["코라곤는 무리를 이끄는 두목이다. 부하들보다 몸집이 두 배는 크다.","볏과 큰 송곳니는 서열의 상징이며, 다치면 부하를 불러 모은다.","두목을 잡으면 무리의 소재를 한꺼번에 구할 수 있어 신참들의 단골 사냥감이다."],lf_abyss:["노크투스는 무리를 이끄는 두목이다. 부하들보다 몸집이 두 배는 크다.","볏과 큰 송곳니는 서열의 상징이며, 다치면 부하를 불러 모은다.","두목을 잡으면 무리의 소재를 한꺼번에 구할 수 있어 신참들의 단골 사냥감이다."],thbeetle:["숲속 번개 맞은 고목에 모여 사는 갑충. 비가 오는 날이면 등껍질이 은은하게 빛난다.","등껍질 안쪽의 얇은 막이 마찰로 전기를 모으며, 다 차면 짧은 낙뢰를 떨어뜨린다.","신참 사냥꾼들이 처음 맞아 보는 번개가 대개 이 녀석의 것이다. 불에 그을리면 축전이 멈춘다."],
 wtoad:["숲속 개울가에서 물방울을 뱉어 벌레를 떨어뜨려 먹는다. 비 오는 날 더 활발하다.","목의 주머니에 물을 모아 탄처럼 뱉는다. 맞으면 젖어서 몸이 무거워진다.","퐁가가 우는 소리가 들리면 곧 비가 온다는 숲 마을의 속담이 있다."],
 fbird:["숲 가장자리 마른 덤불에 둥지를 트는 작은 불새. 꼬리깃에 불씨를 품고 다닌다.","꼬리깃 끝의 비늘이 부싯돌처럼 불꽃을 튀긴다. 물에 젖으면 불씨가 꺼진다.","피르코가 둥지를 튼 덤불은 쉽게 불이 붙어서, 숲지기들이 늘 경계하는 몬스터다."],flag:["구름보다 높은 바람길을 따라 대륙을 순회하는 비룡. 수십 년에 한 번 땅으로 내려와, 그 해에는 모든 몬스터가 숨을 죽인다고 전해진다.","날개는 깃털 대신 수백 장의 칼날 비늘로 이루어져 있으며, 날갯짓 한 번에 공기가 베인다. 등뼈를 따라 흐르는 붉은 빛줄기는 용의 기운이 지나는 통로다.","사냥꾼 길드의 문장에 새겨진 바로 그 몬스터다. 길드를 세운 첫 사냥꾼은 이 비룡의 꼬리칼 하나를 증표로 남겼고, 지금도 의뢰소 한가운데 걸려 있다."],
boar:["숲 가장자리의 덤불을 헤집으며 뿌리와 버섯을 파먹는다. 영역 안에 다른 대형 생물이 들어오면 앞뒤 가리지 않고 돌진해 쫓아낸다.","쇠처럼 단단한 엄니는 평생 자라며, 바위에 갈아 날을 세운다. 두개골이 두꺼워 정면 충돌에도 좀처럼 기절하지 않는다.","신참 사냥꾼의 첫 상대로 유명하지만, 매년 돌진에 뼈가 부러지는 신참이 끊이지 않는다. 길드는 '옆으로 피하라'는 문구를 훈련장 입구에 새겨 두었다."],
crab:["얕은 개울가 바위틈에 몸을 묻고 지나가는 작은 생물을 집게로 낚아챈다. 껍질에 이끼와 돌이 붙어 바위와 구별하기 어렵다.","땅속에 다리 끝을 박아 지면을 진동시키면, 미리 심어 둔 석회질 가시가 한꺼번에 솟아오른다. 이 가시는 탈피 때 버린 껍질 조각이다.","번개를 맞은 개체의 껍질이 쉽게 갈라진다는 기록이 있다. 근처 대장장이들은 이 껍질을 갈아 숫돌 대용으로 쓴다."],
wyvern:["모래 평원의 바위산 꼭대기에 둥지를 틀고, 상승 기류를 타고 넓은 영역을 순찰한다. 침입자를 발견하면 공중에서 화염탄으로 몰아낸다.","목 아래의 화염주머니에 가연성 체액을 모아 두었다가, 이빨을 부딪쳐 불꽃을 일으켜 내뿜는다. 머리를 부수면 화염 분사구가 손상돼 불길이 약해진다.","하늘의 왕이라 불리지만, 새끼를 지킬 때가 아니면 지상전을 피하는 신중한 성격이다. 화염주머니는 연료로도 귀하게 거래된다."],
venom:["무리를 지어 사냥하던 아룡 중 홀로 남은 개체가 독을 품고 대형화한 것으로 여겨진다. 덤불 속에서 사냥감의 체력이 떨어질 때까지 따라다닌다.","송곳니 뿌리의 독샘은 물 때마다 수축해 독을 주입한다. 독은 사냥감을 죽이기보다 지치게 하는 데 쓰인다.","회피 연습 상대로 길드가 추천하는 몬스터. 독에 당한 사냥꾼은 해독초 대신 물약을 마시는 편이 빠르다는 것이 정설이다."],
wolf:["천둥이 잦은 고원에서 서식하며, 구름 사이로 떨어지는 번개를 등의 털로 받아 축전한다. 축전량이 높을수록 움직임이 빨라진다.","등과 꼬리의 털은 전기를 모으는 기관이며, 머리의 뿔은 방전을 조준하는 역할을 한다. 머리에 충격을 받으면 축전이 흐트러진다.","초전하 상태에서는 몸이 푸르게 빛나며 낙뢰를 마음대로 떨어뜨린다. 이 상태를 머리 공격으로 깨뜨린 기록이 길드에 여럿 남아 있다."],
ape:["얼음 산맥의 동굴에서 무리 지어 겨울을 나며, 우두머리는 가장 큰 얼음 동굴을 차지한다. 눈 속에서 곰과 순록을 사냥한다.","입 안의 냉각 기관에서 영하의 숨을 뿜으며, 털 사이에 얼음 조각을 붙여 갑옷처럼 두른다. 이 얼음 갑옷은 몸통을 단단하게 감싼다.","빙갑 무장 상태에서는 몸통의 얼음 갑옷 때문에 공격이 잘 들지 않는다. 갑옷 자체를 계속 두들기면 깨지면서 크게 휘청인다."],
serpent:["바다와 이어진 안개 해안의 물길을 오가며, 몸을 물에 반쯤 담근 채 물고기 떼를 쫓는다. 수면 위로 머리를 내밀고 먼 곳을 살핀다.","목 깊숙한 곳의 고압 수낭에서 물을 압축해 광선처럼 쏜다. 이 물줄기는 바위도 깎아 낼 만큼 강하다.","격류 상태에서는 꼬리를 휘둘러 물을 끌어올린다. 꼬리를 집중 공격하면 수압 조절이 무너져 몸 전체가 경직된다."],
black:["버려진 광산과 쇳돌이 많은 절벽에 살며, 광석을 통째로 삼켜 비늘을 단단하게 만든다. 몸에서 늘 쇳내가 난다.","비늘 사이에 철분이 쌓여 금속처럼 단단하며, 공중에서 쇳덩이를 떨어뜨리는 습성이 있다. 머리 쪽 비늘은 상대적으로 얇다.","강철화 상태에서는 머리를 제외한 모든 부위가 무기를 튕겨 낸다. 이때 머리를 노리는 것이 유일한 해법으로 알려져 있다."],
magma:["화산 지대의 용암 호수 근처에 살며, 식은 용암 바위를 먹이 삼아 등껍질에 쌓는다. 체온이 매우 높아 주변 공기가 일렁인다.","등의 갑각 아래로 용암이 흐르며, 몸통을 비틀어 화산탄을 쏘아 올린다. 몸통 갑각은 열을 식히는 방열판 역할도 한다.","용암 폭주 상태에서는 몸통 갑각이 달아올라 거의 모든 공격을 막는다. 갑각 자체에 피해를 누적시켜 냉각을 깨는 것이 공략의 핵심이다."],
thunderape:["번개가 자주 치는 고지대에서 홀로 살며, 영역 싸움에서 고룡과도 맞선다는 소문이 있다. 성격이 극도로 난폭하다.","털 속 결정이 전기를 저장하며, 흥분하면 털이 곤두서며 금빛으로 빛난다. 머리의 뿔은 방전기관이다.","뇌신 각성 상태에서는 금빛으로 빛나며 사방에 낙뢰를 부른다. 머리를 꺾어 놓으면 저장된 전기가 역류해 쓰러진다."],
iceserpent:["빙하가 떠다니는 북쪽 바다에서 살며, 빙산 아래를 굴처럼 파서 둥지로 쓴다. 몇 년에 한 번 해안으로 올라온다.","혈액에 얼지 않는 성분이 있어 극저온에서도 움직이며, 숨결로 바닷물을 순식간에 얼린다.","얼음 광선과 빙괴 낙하를 동시에 쓰는 몇 안 되는 해룡종이다. 불 속성 무기를 든 사냥꾼만 원정에 보내라는 지침이 있다."],
elder:["생태가 거의 알려지지 않은 고룡. 나타난 땅의 생물이 모두 사라졌다는 기록만 남아 있다.","몸 전체에 용의 기운을 두르고 있으며, 이 기운은 같은 용 속성에 반응해 상쇄된다는 가설이 있다.","종언의 기운을 두른 엔드라시스의 머리를 부숴 쓰러뜨린 사냥꾼은 지금까지 몇 명뿐이다. 그 기록은 길드 금고에 봉인되어 있다."],
bird:["숲의 나무 위를 떼 지어 다니며, 부리로 나무껍질을 쪼아 벌레를 꺼내 먹는다. 경계심이 강해 큰 소리에 놀라 달아난다.","부리는 가볍지만 끝이 단단해 빠르게 연속으로 쪼는 데 특화돼 있다. 물에 젖으면 깃털이 무거워진다.","신참들이 '닭'이라 부르며 얕보다가 연속 쪼기에 당하곤 한다. 길드는 이 몬스터를 '회피 타이밍 교관'이라 부른다."],
spider:["숲속 나무 사이에 거대한 그물을 치고, 걸린 먹이를 감아 저장한다. 그물에는 끈적한 실과 마른 실이 섞여 있다.","배 끝의 실샘에서 뽑는 실은 질기고 끈적해 대형 생물도 잠시 붙잡아 둔다. 불에 매우 약하다.","네토라의 실은 방어구 안감으로 인기가 높다. 다만 실샘을 다치게 하면 실이 녹아 버려 채집이 어렵다."],
gale:["바람이 센 협곡에서 날개를 펼쳐 바람을 타고 다니며, 회오리를 일으켜 작은 동물을 공중으로 띄운 뒤 낚아챈다.","날개깃이 특수하게 휘어 있어 날갯짓만으로 소용돌이를 만들어 낸다. 얼음에 닿으면 깃이 굳는다.","회오리는 느리지만 끈질기게 따라온다. 회오리와 본체를 동시에 보는 시야가 필요하다."],
mudboar:["늪지대 진흙 속에 몸을 묻고 지내며, 진흙을 몸에 발라 체온과 수분을 유지한다. 땅을 파고 이동하기도 한다.","굴착에 특화된 앞발과 코뿔로 진흙을 헤치며, 진흙을 튀겨 상대의 시야와 움직임을 방해한다.","진흙에 젖으면 스태미나 회복이 느려진다. 번개에 진흙이 굳어 갈라지는 약점이 있다."],
vspider:["어두운 동굴 깊은 곳에 둥지를 틀고, 독을 품은 실로 먹이를 마비시킨다. 무리를 짓지 않는다.","독니와 독 가시를 함께 쓰며, 실에도 독이 배어 있다. 불을 극도로 싫어한다.","베노락스의 독주머니는 해독제 연구에 쓰이지만, 채취하다 중독되는 연구원이 끊이지 않는다."],
firebird:["화산 근처 따뜻한 바위 위에 둥지를 틀고, 불꽃 회오리로 먹이를 몰아 사냥한다.","날개깃 끝이 불꽃처럼 달아올라 날갯짓만으로 불씨를 흩뿌린다. 물에 젖으면 불꽃이 약해진다.","파이로스의 깃털은 꺼지지 않는 불씨로 쓰여 대장간에서 귀하게 여겨진다."],
icecrab:["안개 해안의 얼음 동굴 바닥에 몸을 붙이고 살며, 차가운 숨으로 물웅덩이를 얼려 먹이를 가둔다.","갑각 표면에 서리가 덮여 있으며, 집게 안쪽에 냉기 분출구가 있다. 불에 닿으면 갑각이 쉽게 금 간다.","단단하지만 불 앞에서는 무력하다는 이유로 신참들이 화염 무기를 처음 시험하는 상대가 된다."],
tserpent:["폭풍이 몰아치는 해안에서 번개를 몸에 맞으며 지낸다. 몸통 비늘이 전기를 흘려 보내는 통로 역할을 한다.","꼬리 끝의 방전 기관에 전기를 모아 광선과 낙뢰로 쏜다. 얼음에 닿으면 방전이 끊긴다.","뇌사 방전 상태에서는 꼬리가 하얗게 빛난다. 꼬리를 공격하면 방전이 폭주해 스스로 감전된다."],
storm:["폭풍 구름 속을 유영하듯 날며, 땅에 내려오는 일이 드물다. 폭풍이 지나간 뒤에 모습을 드러낸다.","넓은 피막 날개로 기류를 조종하며, 꼬리침으로 번개를 끌어당긴다.","폭풍 전개 상태에서는 꼬리침이 피뢰침 역할을 한다. 꼬리를 공격하면 끌어모은 전기가 터지며 추락한다."],
abyss:["빛이 닿지 않는 심연 동굴에 살며, 수많은 다리로 벽과 천장을 기어 다닌다.","등에서 흘러나오는 용의 기운이 주변 바위를 끌어당겨 운석처럼 떨어뜨린다. 번개에 신경이 마비된다.","니그라쿠스가 나타난 동굴의 다른 생물은 모두 자취를 감춘다. 길드는 심연 탐사 시 반드시 2인 이상을 권고한다."],
bloodape:["붉은 달이 뜨는 밤에만 활발해지며, 평소에는 깊은 숲 동굴에서 잠잔다. 극도로 공격적이다.","흥분하면 혈관이 붉게 부풀어 오르고 근력이 폭발적으로 증가한다. 얼음에 혈류가 둔해진다.","혈월 광폭 상태에서는 미친 듯이 뛰어오른다. 머리에 충격을 주면 혈압이 치솟아 쓰러진다."],
inferno:["화산 꼭대기 분화구에서 태어난다고 전해지는 불새. 날갯짓 한 번에 숲이 불탄다.","깃털 하나하나가 불꽃으로 이루어진 듯 빛나며, 체내 화염주머니가 여러 개다.","인페르나가 지나간 하늘에는 며칠 동안 붉은 노을이 남는다는 이야기가 있다."],
sky:["구름 위 높은 곳에 산다고 전해지는 백색 고룡. 지상에 내려오면 하늘이 무너지듯 번개가 쏟아진다.","몸이 길고 가늘어 공중에서 뱀처럼 미끄러지며, 비늘이 빛을 반사해 눈부시다.","아스트레온을 본 사람은 많지만 쓰러뜨린 기록은 손에 꼽는다."],
void:["세계의 끝에서 왔다는 고룡. 그가 지나간 자리는 색이 빠진 듯 잿빛이 된다.","몸에서 공허의 기운을 뿜으며, 이 기운은 모든 속성을 흐리게 만든다. 오직 용의 힘만이 맞설 수 있다.","공허 개방 상태의 니힐로스를 상대한 사냥꾼들은 '시간이 멈춘 것 같았다'고 증언한다."],
hades:["죽은 자의 강이라 불리는 지하 수로를 오가는 뱀 고룡. 지상에 나타나는 일은 극히 드물다.","몸에서 흘러내리는 검은 액체가 용의 기운을 띠며, 닿은 생물의 힘을 빼앗는다.","스틱사의 출현은 대재앙의 전조로 여겨진다. 길드 최고 등급 의뢰로 분류된다."],
toad:["고요한 숲의 늪지에 살며, 긴 혀로 벌레와 작은 동물을 낚아챈다. 겨울에는 진흙 속에서 잠든다.","끈적한 피부는 마찰을 줄여 공격을 미끄러뜨린다. 불에 피부가 마르면 약해진다.","토르바의 점액은 접착제로 쓰이지만, 냄새가 지독해 공방에서도 기피한다."],
beetle:["숲속 큰 나무 수액을 차지하려 다른 갑충과 뿔싸움을 벌인다. 이긴 개체만 나무를 독점한다.","날개를 펼쳐 짧게 날아오른 뒤 뿔로 내리꽂는다. 갑각이 단단하지만 번개에 약하다.","카브르의 뿔은 아이들 장난감 칼의 재료로 인기가 높다."],
brute:["모래 평원의 바위 지대에 살며, 거대한 턱으로 바위를 깨물어 부순다. 먹이는 대형 초식 생물이다.","머리가 바위처럼 단단해 박치기로 사냥감을 쓰러뜨린다. 물에 젖으면 피부가 물러진다.","고르두스가 던진 바위에 마을 지붕이 뚫린 사건 이후, 바위 지대 접근이 제한되었다."],
fish:["모래 평원의 오아시스와 지하수로를 오가며 산다. 모래 속을 헤엄치듯 이동하기도 한다.","아가미 옆의 수낭에 물을 모아 쏘며, 몸통 박치기로 튀어 오른다.","실라크의 비늘은 푸르게 빛나 장신구로 쓰인다."],
toad2:["습한 동굴과 늪에서 독 안개를 뿜어 주변 생물을 쫓아낸다. 안개 속에서 먹이를 기다린다.","배의 독주머니에서 안개 형태의 독을 내뿜는다. 불에 독주머니가 쉽게 터진다.","그로가가 사는 늪은 풀조차 자라지 않는다."],
beetle2:["번개가 잦은 숲에서 뿔에 번개를 모아 영역 싸움을 한다.","뿔 끝이 전기를 저장하며, 내리찍을 때 방전한다. 얼음에 뿔의 전도가 끊긴다.","라이카브의 뿔은 전기를 오래 저장해 등불 재료로 쓰인다."],
fish2:["얼음 산맥의 얼어붙은 호수 아래에 살며, 얼음을 깨고 튀어 오른다.","비늘 사이에 얼음 결정이 박혀 있으며, 냉기를 머금은 물줄기를 쏜다. 불에 약하다.","니발트가 지나간 호수는 한여름에도 녹지 않는다."],
brute2:["화산 지대의 용암 동굴에 살며, 불꽃을 머금은 턱으로 땅을 부순다.","턱 안의 발화 기관이 불을 뿜으며, 흥분하면 머리가 달아오른다. 물에 약하다.","용암 분화 상태에서는 머리가 용암처럼 붉게 빛난다. 머리를 공격하면 열이 터지며 쓰러진다."],
toad3:["번개가 치는 늪지대에서 배를 울려 번개를 부른다. 그 울음은 몇 리 밖까지 들린다.","울음주머니가 전기를 증폭하는 기관이며, 혀에도 전기가 흐른다.","가마크론의 울음이 들리면 비가 온다는 속담이 있다."],
beetle3:["갑충의 왕이라 불리며, 강철 같은 등껍질로 어떤 상대든 들이받는다.","등껍질이 극도로 단단하지만, 뿔 아래 관절이 약점이다. 번개에 신경이 마비된다.","헤라크론의 등껍질로 만든 방패는 대형 몬스터의 돌진도 막아 낸다고 한다."],
quad:["얼음 바람을 휘감고 설원을 떠도는 고룡. 그가 머무는 곳은 눈보라가 그치지 않는다.","몸 주위에 냉기 장막을 두르며, 숨결로 대지를 얼린다. 불에 장막이 약해진다.","크실라스의 출현으로 산맥 마을 하나가 통째로 얼어붙은 기록이 있다."],
brute3:["심연의 동굴 입구에 사는 거대 포식자. 분노하면 몸이 붉게 갈라진다.","턱 근육이 비정상적으로 발달해 무엇이든 씹어 삼킨다. 번개에 근육이 경직된다.","흑아 각성 상태에서는 갈라진 몸 틈으로 용의 기운이 새어 나온다. 머리를 공격하면 기운이 흩어진다."],
quad2:["불꽃의 갈기를 두른 고룡의 왕. 화산 지대 전체가 그의 영역이다.","갈기에서 화염을 뿜으며, 숨결 하나로 숲을 태운다. 물에 갈기가 약해진다.","벨로가스는 고룡들 사이에서도 왕으로 불린다. 그 앞에서는 다른 몬스터가 모습을 감춘다."],
fish3:["깊은 바다에서 올라온 거대 어룡. 수면 위로 등지느러미만 보여도 어선들이 도망친다.","거대한 몸집에 비해 빠르며, 물을 압축해 광선을 쏜다.","레비아크가 나타난 해역에서는 한동안 물고기가 잡히지 않는다."],
quad3:["하늘을 가르는 번개의 고룡. 그가 울부짖으면 맑은 하늘에도 벼락이 친다.","몸 전체가 전기로 이루어진 듯 빛나며, 뿔에서 번개를 내리친다.","천멸 강림 상태의 아이테르나는 하늘 자체를 무기로 쓴다. 머리를 공격해야만 막을 수 있다."],
beetle4:["재앙을 퍼뜨린다는 거대 갑충. 그가 지나간 땅에는 기이한 병이 돈다.","등껍질에서 용의 기운을 띤 포자를 뿌리며, 불에 포자가 타 버린다.","칼라미톤은 수백 년에 한 번 깨어난다고 전해진다."],
manta2:["안개 해안의 수면 위를 미끄러지듯 날며, 물고기를 낚아챈다.","넓은 날개막으로 물을 퍼 올려 물줄기로 쏜다. 번개에 날개막이 경련한다.","스카라는 어부들 사이에서 '바다 위의 연'이라 불린다."],
golem2:["바위 지대에 몸을 묻고 바위처럼 지내다가, 가까이 오는 생물을 덮친다.","등껍질의 바위를 흔들어 떨어뜨리며, 발굽으로 땅을 울린다. 번개에 약하다.","테라곤이 잠든 바위를 신전으로 착각해 기도하던 순례자들의 이야기가 있다."],
centi2:["화산 지대의 갈라진 땅속을 기어 다니며, 불을 뿜어 먹이를 굽는다.","수많은 다리 끝이 열을 내며, 지나간 땅에 불자국이 남는다. 물에 약하다.","무카데라가 지나간 자리는 한동안 김이 피어오른다."],
mole2:["심연의 동굴 근처 얼어붙은 땅속을 파고 다니며, 발밑에서 솟구쳐 먹이를 잡는다.","굴착손이 강철처럼 단단해 얼음도 파고든다. 불에 굴착손이 무뎌진다.","그란디스가 판 굴은 지하 미로처럼 얽혀 있어 탐사대도 길을 잃는다."],
mount:["산처럼 거대한 갑수. 수십 년에 한 번 이동하며, 지나가는 길에 산이 생긴다는 말이 있다.","등껍질 위에 숲과 바위가 자라며, 그 무게로 땅을 울린다. 등 뒤의 핵이 생명의 중심이다.","몬테라스의 이동 경로를 예측하는 것이 길드의 중요한 임무 중 하나다."],

function setLoad(i){const st=S.sets[i];if(!st)return;const miss=[];
  if(S.own[`${st.weapon}:${st.wkey}`]||st.wkey==="starter"){S.weapon=st.weapon;S.eq[st.weapon]=st.wkey}else miss.push("무기");
  SLOTS.forEach(([sl,lbl])=>{const k=st[sl];if(!k)S.eq[sl]=null;else if(S.own[k])S.eq[sl]=k;else miss.push(lbl)});
  if(st.charm&&charmOf(st.charm))S.eq.charm=st.charm;else if(st.charm)miss.push("호석");else S.eq.charm=null;
  const dmiss=[];if(st.socks){const keys=Object.keys(st.socks).filter(k=>equippedItems().some(it=>it.key===k));
    keys.forEach(k=>{S.sock[k]=(S.sock[k]||[]).map(()=>null)});
    keys.forEach(k=>{const it=equippedItems().find(x=>x.key===k);const arr=S.sock[k]=new Array(it.slots.length).fill(null);
      st.socks[k].forEach((n,j)=>{if(!n||j>=arr.length)return;if(availDeco(n)<=0){let src=null;for(const ok in S.sock){if(keys.includes(ok))continue;const jj=S.sock[ok].indexOf(n);if(jj>=0){src=[ok,jj];break}}if(src)S.sock[src[0]][src[1]]=null;else{dmiss.push(deName(n));return}}arr[j]=n})})}
  save();renderHub();overlay(`<h3 class="big">${st.name} 장착</h3><p>${miss.length?`없는 장비는 건너뛰었어요: ${miss.join(", ")}<br>`:""}${dmiss.length?`부족한 장식주: ${dmiss.join(", ")}`:st.socks?"장비와 장식주를 세트대로 장착했어요.":"장비를 장착했어요. (예전에 저장한 세트라 장식주 정보는 없어요. 다시 저장하면 장식주도 기억해요)"}</p><button id="oA">확인</button>`);$("oA").onclick=()=>$("ov").hidden=true}

    if(b.trav>b.range||b.x<0||b.x>AW||b.y<0||b.y>AH){b.done=true;continue}
    if(b.trav<0)continue;
    if(FLD.solids.some(o=>Math.hypot(b.x-o.x,b.y-o.y)<o.r)){b.done=true;fx.push({k:"spark",x:b.x,y:b.y,vx:0,vy:0,l:.15,col:"#ddd"});continue}
    if(OPEN&&SMS.length){let hs=null;for(const m of SMS)if(m.state!=="dead"&&Math.hypot(m.x-b.x,m.y-b.y)<m.r+4&&!(b.hits["s"+SMS.indexOf(m)]!==undefined)){hs=m;break}if(hs){b.hits["s"+SMS.indexOf(hs)]=b.trav;hurtSmall(hs,b.mv,false,{dm:1});if(--b.pierce<=0){b.done=true;continue}}}
    {let hm=false;for(const n of MIN)if(!n.dead&&Math.hypot(n.x-b.x,n.y-b.y)<n.r+5){n.dead=true;hm=true;fx.push({k:"boom",x:n.x,y:n.y,r:34,l:.3,col:"#c58cff"});break}if(hm){b.done=true;continue}}
    const foc0=M;for(const mm of (OPEN?MSL:[M])){if(mm.state==="dead"||b.done)continue;M=mm;const hk=OPEN?mm.k+":":"";
    for(const p of parts()){const last=b.hits[hk+p.n];if(last!==undefined&&b.trav-last<(b.gap||40))continue;
      if(Math.hypot(p.x-b.x,p.y-b.y)<p.r+4){b.hits[hk+p.n]=b.trav;const t=b.trav;
        const dm=b.lbg?((b.kind==="spread"?t<130:t<=190)?1:.4):b.kind==="spread"?(t<150?1:.6):["elem","snipe","dragon","counter"].includes(b.kind)?1:b.kind==="arrow"?(t<60?.7:t<=320?1:.75):(t<40?.8:t<=190?1:Math.max(.45,1-(t-190)/250));
        hitMonster(p,b.mv,false,{dm:b.kind==="elem"?dm*.7:dm,ch:b.chain,ex:b.ex!==undefined?b.ex:b.el?1:0});
        if(b.sb)statusBuild(b.sb,b.amt);
        if(b.eboom){fx.push({k:"boom",x:b.x,y:b.y,r:54,l:.35,col:P.el?ELC[P.el]:"#ffb347"});dealRaw(Math.round(6+P.E*.5+P.raw*.06),b.x,b.y,P.el?ELC[P.el]:"#ffb347")}
        if(b.stick){M.stick={n:5};texts.push({x:p.x,y:p.y-30,t:"철갑유탄 부착",c:"#d9a441",l:.8})}
        if(b.boom){fx.push({k:"boom",x:b.x,y:b.y,r:70,l:.4,col:"#ff9f43"});dealRaw(Math.round(22+P.raw*.18),b.x,b.y,"#ff9f43",true);shake=Math.max(shake,.15)}
        if(--b.pierce<=0||M.state==="dead"){b.done=true;break}}}
    }M=foc0;
  }
  pb=pb.filter(b=>!b.done);
}

function sendBug(){if(P.bug.st!=="home"||M.state==="dead"||M.under)return;const ax=P.x+Math.cos(P.ang)*200,ay=P.y+Math.sin(P.ang)*200;let best=null,bd=1e9;parts().forEach(p=>{const d=Math.hypot(p.x-ax,p.y-ay);if(d<bd){bd=d;best=p}});if(!best)return;if(Math.hypot(best.x-P.x,best.y-P.y)>270){texts.push({x:P.x,y:P.y-34,t:"사거리 밖",c:"#ffb3b3",l:.7});return}P.bug.st="out";P.bug.tp=best.n;P.bug.t=0}
function upBug(dt){const b=P.bug;if(!b)return;b.t=(b.t||0)+dt;
  if(b.st==="home"){const tx=P.x+Math.cos(P.ang+1.9)*20,ty=P.y+Math.sin(P.ang+1.9)*20;b.x+=(tx-b.x)*Math.min(1,dt*10);b.y+=(ty-b.y)*Math.min(1,dt*10);return}
  let tx,ty;if(b.st==="out"){const pt=M.state!=="dead"&&parts().find(p=>p.n===b.tp);if(!pt||b.t>2.5){b.st="back";return}tx=pt.x;ty=pt.y}else{tx=P.x;ty=P.y}
  const d=Math.hypot(tx-b.x,ty-b.y),sp=680*dt;if(d>sp){b.x+=(tx-b.x)/d*sp;b.y+=(ty-b.y)/d*sp;return}

function inShapeAt(s,x,y,rad){
  if(s.k==="circle")return Math.hypot(x-s.x,y-s.y)<s.r+rad;
  if(s.k==="sector")return Math.hypot(x-s.x,y-s.y)<s.r+rad&&Math.abs(adiff(Math.atan2(y-s.y,x-s.x),s.a))<s.arc/2;
  if(s.k==="rect"){const dx=x-s.x,dy=y-s.y,c=Math.cos(s.a),sn=Math.sin(s.a),al=dx*c+dy*sn,pp=-dx*sn+dy*c;return al>0&&al<s.len&&Math.abs(pp)<s.w/2+rad}return false}

  drawMonster({x:0,y:0,ang:ma,r:d.r,d,state:roar?"act":"chase",anim:ta,enr:true,hb:false,tb:false,atk:null,at:0},tg);tg.restore();
  if(roar){tg.strokeStyle=`rgba(255,77,109,${.35+Math.sin(ta*20)*.15})`;tg.lineWidth=3*k;for(let i=1;i<=3;i++){tg.beginPath();tg.arc(mx,my,(d.r*sc)*(1.2+((ta*1.5+i*.33)%1)*1.4),0,7);tg.stroke()}}
  const aimD=Math.hypot(mx-hx,my-hy)/hs-d.r*sc/hs*1.1;
  tg.save();tg.translate(hx,hy);tg.rotate(Math.atan2(my-hy,mx-hx));tg.scale(hs,hs);drawTitleHunter(tg,ta,aimD);tg.restore();
  while(emb.length<60)emb.push({x:Math.random()*W,y:H+Math.random()*H*.3,v:(.3+Math.random()*.8)*k,s:(1+Math.random()*2)*k,w:Math.random()*6});
  emb.forEach(p=>{p.y-=p.v;p.x+=Math.sin(ta*1.5+p.w)*.4*k;if(p.y<-10)p.y=H+10;tg.fillStyle=`rgba(255,${130+Math.floor(p.w*14)},90,${.3+.35*Math.sin(ta*3+p.w)})`;tg.fillRect(p.x,p.y,p.s,p.s)});
  const vg=tg.createRadialGradient(W/2,H/2,U*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.7)");tg.fillStyle=vg;tg.fillRect(0,0,W,H)}
 tLoop();
 const tGo=()=>{if(!TITLE)return;TITLE=false;auInit();bgmPlay("hub");$("title").classList.add("out");setTimeout(()=>{$("title").style.display="none";maybeTutorial();if(S.storyNote)storyNoteDlg()},600)};
 $("title").addEventListener("click",tGo);$("tVer").textContent=VERSION+(TESTMODE?" · 🧪TEST":"");$("tUpd").addEventListener("click",e=>{e.stopPropagation();noticeDialog()});$("tLegal").textContent=LEGAL;setTimeout(()=>{if(TITLE&&!AUTHCB&&S.noticeV!==VERSION)noticeDialog()},600);}
initCloud().finally(()=>{if(!TITLE)setTimeout(maybeTutorial,300)});
